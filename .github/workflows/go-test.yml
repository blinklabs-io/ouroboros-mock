name: go-test

on:
  push:
    tags:
      - v*
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  go-test:
    name: go-test
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.26.x, 1.27.x]
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0 https://github.com/actions/setup-go/releases/tag/v7.1.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - name: prepare conformance data
        run: make prepare-blueprint-testdata
      - name: go-test
        run: go test ./...

  conformance:
    name: conformance
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.26.x, 1.27.x]
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 https://github.com/actions/checkout/releases/tag/v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0 https://github.com/actions/setup-go/releases/tag/v7.1.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
      - name: prepare conformance data
        run: make prepare-blueprint-testdata
      - name: conformance
        run: go test -race -timeout 15m -v ./conformance/...
